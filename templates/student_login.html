{% extends "base.html" %}

{% block title %}Student Sign In · Hostel Sampark{% endblock %}

{% block content %}
<div class="mx-auto max-w-md overflow-hidden rounded-3xl border border-slate-200 bg-white p-6 shadow-xl dark:border-slate-800 dark:bg-slate-900 sm:p-8">
    <div class="mb-6 text-center">
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Student Sign In</h1>
        <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">
            Sign in with your verified student account to submit and manage your grievances.
        </p>
    </div>

    <form method="POST" action="{{ url_for('student_login') }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label for="email" class="block text-xs font-semibold uppercase tracking-wide text-slate-700 dark:text-slate-300">Email Address</label>
            <input type="email" id="email" name="email" required
                   class="mt-1 block w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100"
                   placeholder="you@example.com">
        </div>

        <div>
            <label for="password" class="block text-xs font-semibold uppercase tracking-wide text-slate-700 dark:text-slate-300">Password</label>
            <input type="password" id="password" name="password" required
                   class="mt-1 block w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100"
                   placeholder="Your password">
        </div>

        <button type="submit"
                class="w-full rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-md transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
            Sign In
        </button>
    </form>

    <div class="mt-6 flex flex-col gap-2 text-center text-xs text-slate-500 dark:text-slate-400">
        <div>
            Don't have an account yet?
            <a href="{{ url_for('student_register') }}" class="font-semibold text-indigo-600 hover:underline dark:text-indigo-400">Register here</a>
        </div>
        <div>
            Hostel Staff?
            <a href="{{ url_for('login') }}" class="font-semibold text-slate-600 hover:underline dark:text-slate-300">Staff login →</a>
        </div>
    </div>
</div>
{% endblock %}
