{% extends "base.html" %}

{% block title %}Student Registration · Hostel Sampark{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg overflow-hidden rounded-3xl border border-slate-200 bg-white p-6 shadow-xl dark:border-slate-800 dark:bg-slate-900 sm:p-8">
    <div class="mb-6 text-center">
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Student Registration</h1>
        <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">
            Create an account to submit and track your hostel grievances.
        </p>
    </div>

    <form method="POST" action="{{ url_for('student_register') }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label for="full_name" class="block text-xs font-semibold uppercase tracking-wide text-slate-700 dark:text-slate-300">Full Name</label>
            <input type="text" id="full_name" name="full_name" required maxlength="100"
                   class="mt-1 block w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100"
                   placeholder="e.g. Puneet Kumar">
        </div>

        <div>
            <label for="email" class="block text-xs font-semibold uppercase tracking-wide text-slate-700 dark:text-slate-300">Email Address</label>
            <input type="email" id="email" name="email" required maxlength="120"
                   class="mt-1 block w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100"
                   placeholder="you@example.com">
            <span class="mt-1 block text-xs text-slate-500">We'll send a confirmation link to this email.</span>
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
                <label for="hostel" class="block text-xs font-semibold uppercase tracking-wide text-slate-700 dark:text-slate-300">Hostel</label>
                <select id="hostel" name="hostel" required
                        class="mt-1 block w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
                    <option value="" disabled selected>Select Hostel</option>
                    {% for h in hostels %}
                    <option value="{{ h }}">{{ h }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="room_number" class="block text-xs font-semibold uppercase tracking-wide text-slate-700 dark:text-slate-300">Room No.</label>
                <input type="text" id="room_number" name="room_number" required maxlength="20"
                       class="mt-1 block w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100"
                       placeholder="e.g. B-204">
            </div>
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
                <label for="enrollment_no" class="block text-xs font-semibold uppercase tracking-wide text-slate-700 dark:text-slate-300">Enrollment No.</label>
                <input type="text" id="enrollment_no" name="enrollment_no" required maxlength="50"
                       class="mt-1 block w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100"
                       placeholder="e.g. 21045012">
            </div>
            <div>
                <label for="contact_number" class="block text-xs font-semibold uppercase tracking-wide text-slate-700 dark:text-slate-300">Contact No.</label>
                <input type="tel" id="contact_number" name="contact_number" required maxlength="15"
                       class="mt-1 block w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100"
                       placeholder="e.g. 9876543210">
            </div>
        </div>

        <div>
            <label for="password" class="block text-xs font-semibold uppercase tracking-wide text-slate-700 dark:text-slate-300">Password</label>
            <input type="password" id="password" name="password" required minlength="6"
                   class="mt-1 block w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100"
                   placeholder="At least 6 characters">
        </div>

        <button type="submit"
                class="w-full rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-md transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
            Register Account
        </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-500 dark:text-slate-400">
        Already registered?
        <a href="{{ url_for('student_login') }}" class="font-semibold text-indigo-600 hover:underline dark:text-indigo-400">Sign in here</a>
    </div>
</div>
{% endblock %}
